</head>

<body>

    <nav>

        <h1>FitTrack</h1>

        <!-- Website logo -->

        <div class="nav-links">

            <a href="Landing.html">Home</a> 
                
                <!-- Link to home page -->

            <a href="workouts.html">Workouts</a> 
                
                <!-- Link to workouts page -->

            <a href="nutrition.html">Nutrition</a> 
                
                <!-- Link to nutrition page -->

            <a href="tracker.html">Progress Tracker</a> 
            
                <!-- Link to progress tracker page -->


            <div class="dropdown"> <!-- Dropdown menu -->
                <button class="dropbtn"> More ▼ </button>
                    <div class="dropdown-content">
                        <a href="about.html">About Us</a>
                        
                        <!-- Link to about page -->

                        <a href="subscriptions.html">Subscriptions</a> 
                        
                        <!-- Link to subscriptions page -->

                        <a href="contact.html">Contact</a>

            </div>

        </div>

            Get Started
        </a>

        <!-- Takes user to sign up page -->

    </nav>

    <div class="contact-header">

        <!-- Main contact section -->

        <div class="contact-text">

            <h1>Contact</h1>

            <!-- Contact page heading -->

            <p>

                Need help with your fitness journey?

                Have questions about workouts,
                nutrition plans or subscriptions?

                We're here to help.

            </p>

            <!-- Brief contact description -->

        </div>

        <div class="contact-image">

            <img src="AdobeStock_279281463.jpeg" alt="Fitness Support">

            <!-- Contact page image -->

        </div>

    </div>

    <div class="contact-section">

        <!-- Contact form section -->

        <h2>

            Want to know more?

        </h2>

        <!-- Contact form heading -->

        <form>

            <div class="contact-row">

                <input type="text" placeholder="Name">

                <!-- User enters name -->

                <input type="email" placeholder="Email Address">

                <!-- User enters email address -->

                <input type="tel" placeholder="Phone Number">

                <!-- User enters phone number -->

            </div>

            <textarea placeholder="Message"></textarea>

            <!-- User enters message -->

            <button type="submit">

                Submit

            </button>

            <!-- Submit button -->

        </form>

    </div>
