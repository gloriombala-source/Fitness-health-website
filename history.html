<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History</title>
  <link rel="stylesheet" href="workoutpagestyle.css">
</head>
<body>

  <!-- ===== SHARED NAV (exact same on every page of the site) ===== -->
  <nav>

    <h1>FitTrack</h1>
    <!-- Website logo -->

    <div class="nav-links">

      <a href="dashboard.html">Home</a>
      <!-- Link to dashboard homepage -->

      <a href="workout.html">Workouts</a>
      <!-- Link to workouts page -->

      <a href="nutrition.html">Nutrition</a>
      <!-- Link to nutrition page -->

      <a href="progress.html">Progress Tracker</a>
      <!-- Link to progress tracker page -->

      <div class="dropdown">
        <!-- Dropdown menu -->

        <button class="dropbtn">
          More ▼
        </button>

        <div class="dropdown-content">

          <a href="about.html">About Us</a>
          <!-- Link to about page -->

          <a href="subscription.html">Subscriptions</a>
          <!-- Link to subscriptions page -->

          <a href="Contact.html">Contact</a>
          <!-- Link to contact page -->

        </div>

      </div>

    </div>

    <a href="Landing.html" class="signup-btn">
      Log Out
    </a>
    <!-- Logs user out and returns to landing page -->

  </nav>

  <!-- ===== WORKOUT TRACKER TABS (only on the tracker pages) ===== -->
  <div class="tracker-nav">
    <a href="workout.html">WORKOUT</a>
    <a href="history.html" class="current">HISTORY</a>
    <a href="exercises.html">EXERCISES</a>
  </div>

  <main>
    <div class="history-top">
      <h1>History.</h1>
      <button class="text-btn red" onclick="localStorage.removeItem('history'); location.reload();">Clear History</button>
    </div>
    <p class="subtitle">Every workout you've finished.</p>

    <div id="history-list">
      <p class="empty">No workouts yet. Finish a workout and it will show up here.</p>
    </div>
  </main>

  <!-- Show the saved workouts -->
  <script>
    if (localStorage.getItem("history") !== null) {
      document.getElementById("history-list").innerHTML = localStorage.getItem("history");
    }
  </script>

</body>
</html>
